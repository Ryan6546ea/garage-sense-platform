[project]
name = "sim-core"
version = "0.1.0"
description = "Shared contracts for the garage simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
