[project]
name = "control-service"
version = "0.1.0"
description = "Scenario orchestration and deterministic random test-run service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.3,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "pydantic-settings>=2.7,<3",
    "sim-core",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sim-core = { workspace = true }
