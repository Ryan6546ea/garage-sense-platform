[project]
name = "data-cleanup"
version = "0.1.0"
description = "Bounded periodic PostgreSQL telemetry retention worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
